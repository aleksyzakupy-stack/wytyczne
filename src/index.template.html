<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wytyczne — ginekologia i położnictwo</title>
<meta name="description" content="Polskie wytyczne ginekologiczne i położnicze. Wyszukiwanie według problemów klinicznych, skrótów i słów kluczowych.">
<style>
:root{--paper:#f7f7f3;--ink:#203a37;--muted:#6e7b74;--line:#dedfd6;--accent:#2f5d4e;--soft:#edf0e6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button,a,input,select,summary{-webkit-tap-highlight-color:transparent}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:4px}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}main{width:min(1180px,100% - 72px);margin:auto;padding:54px 0 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:34px}h1{font:normal clamp(36px,5vw,54px)/1.05 Georgia,"Times New Roman",serif;letter-spacing:-.045em;margin:0}.top-right{display:flex;align-items:center;gap:24px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.download{border:1px solid #bdc8bd;border-radius:6px;padding:9px 14px;color:var(--ink);background:transparent}.search{display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--ink);padding:10px 0 17px}.search svg{flex:none;width:25px;height:25px;stroke:var(--accent)}#q{border:0;outline:0;background:transparent;min-width:0;width:100%;font-size:23px;letter-spacing:-.025em;color:var(--ink);padding:0}#q::-webkit-search-cancel-button{display:none}#q::placeholder{color:#929c90;font-weight:350}.clear{border:0;background:none;padding:5px;font-size:24px;line-height:1;color:var(--muted)}.filters{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:12px;margin-top:22px}select{width:100%;min-width:0;appearance:auto;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);font-size:12px;padding:11px 10px;min-height:42px;outline-offset:2px}.reset{border:0;background:transparent;font-size:12px;color:var(--muted);padding:0 8px}.results-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:27px 0 12px;font-size:12px;color:var(--muted)}#count{color:var(--ink);font-weight:500}#sort{width:auto;border:0;padding:4px 0 4px 10px;min-height:28px;color:var(--muted)}#outside,#suggestions{font-size:13px;margin:0 0 14px}.text-button{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}.list{border-top:1px solid var(--line)}.entry{display:grid;grid-template-columns:55px minmax(0,1fr) 92px;gap:23px;padding:25px 0;border-bottom:1px solid var(--line)}.year{font-size:16px;font-variant-numeric:tabular-nums;font-weight:500;padding-top:2px}.id{font-size:10px;color:var(--muted);margin-top:7px}.entry h2{font-size:16px;font-weight:550;line-height:1.55;letter-spacing:-.012em;margin:0 0 8px;max-width:830px}.byline{font-size:11px;line-height:1.7;color:var(--muted)}.status{display:inline;color:#58685a}.status::before{content:'·';margin:0 8px;color:#9aa696}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}.tag{font-size:11px;background:var(--soft);border:0;border-radius:4px;padding:4px 8px;color:#5c6e5e}.tag:hover,.tag.matched{background:#dfe9d8;color:#2f513e}.actions{display:flex;flex-direction:column;align-items:stretch;gap:12px;padding-top:2px}.file{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 12px;border:1px solid #aebcaf;border-radius:5px;font-size:12px;transition:background .15s}.file:hover{background:var(--accent);color:#fff;border-color:var(--accent);text-decoration:none}.source{font-size:11px;text-align:center;color:var(--muted)}.no-file{font-size:11px;color:var(--muted);text-align:center;padding:10px 0}details{font-size:12px;color:var(--muted);margin-top:14px}summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:7px}summary::-webkit-details-marker{display:none}summary::before{content:'+';font-size:16px;line-height:1}details[open] summary::before{content:'−'}details[open]{padding-bottom:6px}.detail-body{max-width:800px;padding-top:7px;overflow-wrap:anywhere}.detail-body p{margin:8px 0}.detail-body strong{font-weight:550;color:var(--ink)}.detail-body a{text-decoration:underline;text-underline-offset:3px}.empty{padding:65px 0;text-align:center;color:var(--muted);font-size:17px}.bottom{display:flex;justify-content:space-between;gap:15px;margin-top:24px;color:var(--muted);font-size:11px}.bottom a{text-decoration:underline;text-underline-offset:3px}mark{background:#e4ebcf;color:inherit;border-radius:2px;padding:1px 0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}[hidden]{display:none!important}.suggestion{margin:0 0 0 10px}.counter{font-variant-numeric:tabular-nums}
@media(max-width:760px){main{width:calc(100% - 36px);padding-top:28px}.top{margin-bottom:28px;align-items:flex-end}.top-right{gap:12px}.top-right time{display:none}#q{font-size:18px}.filters{grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.reset{text-align:right;padding:10px}.entry{grid-template-columns:42px minmax(0,1fr);gap:15px;padding:20px 0}.entry h2{font-size:15px}.actions{grid-column:2;flex-direction:row;align-items:center;padding-top:0}.file{padding:8px 14px}.source{padding:8px}.year{font-size:14px}.id{font-size:9px}.results-bar{margin-top:22px}.bottom{flex-wrap:wrap}.tags{gap:5px}}
@media print{.search,.filters,.top-right,.results-bar,#outside,#suggestions,.tags,.bottom{display:none}.entry{break-inside:avoid}body{background:white}main{width:100%;padding:0}details{display:none}}
</style></head><body><main>
<header class="top"><h1>Wytyczne</h1><div class="top-right"><time datetime="2026-10-27">27.10.2026</time><a class="download" href="katalog.csv" download>Eksport CSV ↗</a></div></header>
<div class="search"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7.5" stroke-width="1.5"/><path d="m16 16 5 5" stroke-width="1.5"/></svg><label for="q" class="sr-only">Szukaj dokumentów</label><input id="q" type="search" placeholder="Problem kliniczny, skrót, słowo kluczowe…" autocomplete="off" spellcheck="false"><button id="clear" class="clear" aria-label="Wyczyść zapytanie" hidden>×</button></div>
<div class="filters"><label class="sr-only" for="category">Temat</label><select id="category"><option value="">Wszystkie tematy</option></select><label class="sr-only" for="collection">Zbiór</label><select id="collection"><option value="">Wszystkie dokumenty</option></select><label class="sr-only" for="availability">Dostępność i język</label><select id="availability"><option value="">Dowolny język i dostęp</option><option value="local">Z plikiem</option><option value="missing">Bez pliku</option><option value="pl">Tekst polski</option></select><button id="reset" class="reset">Wyczyść filtry</button></div>
<div class="results-bar"><span id="count" role="status" aria-live="polite" class="counter"></span><label class="sr-only" for="sort">Sortowanie</label><select id="sort"><option value="relevance">Trafność</option><option value="newest">Najnowsze</option><option value="title">Tytuł A–Z</option></select></div>
<div id="outside" hidden></div><div id="suggestions" hidden></div><div class="list" id="list"></div><div class="bottom"><span id="total"></span><a href="katalog.json" download>JSON</a></div>
</main><script>__SEARCH_ENGINE__</script><script>
const DATA=__DATA__,LABELS=__LABELS__,COUNTS=__COUNTS__;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const engine=CatalogSearch.create(DATA),norm=CatalogSearch.norm;
const statusNames={potwierdzony_obowiazujacy:'Obowiązujący',aktualna_wg_zrodla:'Aktualny wg wydawcy',najnowsza_znaleziona:'Najnowsza odnaleziona wersja',w_wykazie_wydawcy:'W wykazie wydawcy',wymaga_weryfikacji:'Aktualność niepotwierdzona',starsza_wersja:'Starsza wersja',zastapiona:'Zastąpiony',nowsze_w_pokrewnym_zakresie:'Nowsze dokumenty powiązane',zastapiona_czesciowo:'Częściowa aktualizacja',czesciowo_zaktualizowana:'Z uzupełnieniami'};
const groupNames={'Polskie — wykaz główny':'Polskie · wykaz główny','Aktualność wymaga weryfikacji':'Aktualność niepotwierdzona','Polskie organizacje — tekst angielski':'Polskie · tekst angielski','Polskie tłumaczenia międzynarodowe':'Przekłady międzynarodowe','Stanowiska produktowe':'Stanowiska produktowe','Starsze wersje i nowsze dokumenty pokrewne':'Starsze wersje','Materiały pomocnicze':'Materiały pomocnicze'};
for(const [value,label] of Object.entries(groupNames)){const n=DATA.filter(r=>r.collection===value).length;if(n)$('collection').add(new Option(`${label} (${n})`,value));}
[...new Set(DATA.map(r=>r.category))].sort((a,b)=>a.localeCompare(b,'pl')).forEach(c=>$('category').add(new Option(c,c)));
$('total').textContent=`${COUNTS.records} dokumentów · ${COUNTS.pdf_records} PDF`;
function highlighted(text,terms){return String(text).split(/([\p{L}\p{N}]+)/u).map(part=>terms.some(t=>CatalogSearch.wordMatch(norm(part),t))?`<mark>${esc(part)}</mark>`:esc(part)).join('');}
function noun(n){return n===1?'dokument':n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?'dokumenty':'dokumentów';}
function setQuery(value){$('q').value=value;render();$('q').focus();}
function resetFilters(){for(const id of ['collection','category','availability'])$(id).value='';render();}
function render(){
  const query=$('q').value.trim(),all=engine.search(query),group=$('collection').value,cat=$('category').value,access=$('availability').value;
  let rows=all.filter(({record:r})=>(!group||r.collection===group)&&(!cat||r.category===cat)&&(!access||access==='local'&&r.local_path||access==='missing'&&!r.local_path||access==='pl'&&r.polish_text_available));
  if($('sort').value==='newest')rows.sort((a,b)=>(b.record.year||0)-(a.record.year||0)||b.score-a.score);
  if($('sort').value==='title')rows.sort((a,b)=>a.record.title.localeCompare(b.record.title,'pl'));
  $('count').textContent=`${rows.length} ${noun(rows.length)}`;$('clear').hidden=!query;
  const hidden=all.length-rows.length;$('outside').hidden=!query||!hidden;
  $('outside').innerHTML=hidden?`<button class="text-button" id="show-all">Poza filtrami: ${hidden} · pokaż wszystkie</button>`:'';
  const suggestions=all.length?[]:engine.suggest(query);$('suggestions').hidden=!suggestions.length;
  $('suggestions').innerHTML=suggestions.length?'Szukaj: '+suggestions.map(s=>`<button class="text-button suggestion" data-query="${esc(s.query)}">${esc(s.query)}</button>`).join(''):'';
  $('list').innerHTML=rows.map(({record:r,matchedKeywords,terms})=>{
    const tags=(query?matchedKeywords:r.keywords||[]).slice(0,4);
    return `<article class="entry" data-id="${esc(r.id)}"><div><div class="year">${esc(r.year||'—')}</div><div class="id">${esc(r.id)}</div></div><div><h2>${highlighted(r.title,terms)}</h2><div class="byline">${esc(r.organization)}<br>${esc(r.language.toUpperCase())}${r.pages?` · ${r.pages} s.`:''}<span class="status">${esc(statusNames[r.currency_status]||r.currency_status)}</span></div>${tags.length?`<div class="tags">${tags.map(k=>`<button class="tag ${query?'matched':''}" data-query="${esc(k)}">${esc(k)}</button>`).join('')}</div>`:''}<details><summary>Szczegóły</summary><div class="detail-body"><p>${esc(r.currency_note)}</p><p><strong>Publikacja:</strong> ${esc(r.publication_date||r.year||'—')}${r.year_basis?` · ${esc(r.year_basis)}`:''}</p>${r.original_title?`<p>${esc(r.original_title)}</p>`:''}<p>${esc(r.notes||'')}</p>${r.keywords?.length?`<p><strong>Hasła:</strong> ${r.keywords.map(k=>esc(k)).join(' · ')}</p>`:''}${r.related_ids?.length?`<p><strong>Powiązane:</strong> ${r.related_ids.map(id=>`<button class="text-button" data-related="${esc(id)}">${esc(id)}</button>`).join(' · ')}</p>`:''}${r.evidence_urls?.length?`<p><strong>Źródła:</strong> ${r.evidence_urls.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener">${i+1}</a>`).join(' · ')}</p>`:''}</div></details></div><div class="actions">${r.local_path?`<a class="file" href="${esc(r.local_path)}" target="_blank" rel="noopener">${esc(r.file_type.toUpperCase())} <span aria-hidden="true">↗</span></a>`:'<span class="no-file">Bez pliku</span>'}<a class="source" href="${esc(r.source_url)}" target="_blank" rel="noopener">Źródło ↗</a></div></article>`;
  }).join('')||'<div class="empty">Brak wyników</div>';
  document.querySelectorAll('[data-query]').forEach(b=>b.addEventListener('click',()=>setQuery(b.dataset.query)));
  document.querySelectorAll('[data-related]').forEach(b=>b.addEventListener('click',()=>{for(const id of ['collection','category','availability'])$(id).value='';setQuery(b.dataset.related);$('q').scrollIntoView({block:'center',behavior:'smooth'});}));
  if($('show-all'))$('show-all').addEventListener('click',resetFilters);
}
$('q').addEventListener('input',render);for(const id of ['collection','category','availability','sort'])$(id).addEventListener('change',render);
$('clear').addEventListener('click',()=>setQuery(''));$('reset').addEventListener('click',resetFilters);
$('q').addEventListener('keydown',e=>{if(e.key==='Escape')setQuery('');});
render();
</script></body></html>

</main><script>/* Indeks lokalny: tytuły, ręcznie opracowane hasła, autorzy, rok i identyfikatory. */
(function(root){
  'use strict';
  const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l');
  const searchText=s=>norm(s).replace(/\b(cin|ki|p)\s*[- ]?\s*(\d+)\b/g,'$1$2').replace(/\bpd\s*-?\s*l\s*-?\s*(\d+)\b/g,'pdl$1');

  const stem=w=>w.length>=5?w.replace(/(?:ami|ach|owi|ego|owej|owym|owych|ej|ie|ow|om|em|a|i|u|e|y|o)$/,''):w;
  const stop=new Set(['w','we','z','ze','na','do','u','o','i','oraz','dla','a','czy','jak','sie','jest','sa','przy','wg','wedlug','dotyczace','dotyczacych','wytyczne','zalecenia','rekomendacje']);
  const queryTokens=q=>{const all=tokens(q),useful=all.filter(t=>!stop.has(t));return [...new Set(useful.length?useful:all)];};
  function wordMatch(word,query){
    if(word===query)return 1;
    if(query.length>=3&&word.startsWith(query)&&/^\d+$/.test(word.slice(query.length)))return .9;
    if(query.length<4||word.length<4)return 0;
    const qs=stem(query),ws=stem(word);
    if(qs===ws)return .94;
    return qs.length>=4&&word.startsWith(qs)? .78:0;
  }
  function distance(a,b,max){
    if(Math.abs(a.length-b.length)>max)return max+1;
    let prev=Array.from({length:b.length+1},(_,i)=>i);
    for(let i=1;i<=a.length;i++){
      const row=[i];
      for(let j=1;j<=b.length;j++)row[j]=Math.min(row[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
      if(Math.min(...row)>max)return max+1;
      prev=row;
    }
    return prev[b.length];
  }
  function create(records){
    const vocabulary=new Map();
    const entries=records.map(record=>{
      const keywords=record.keywords||[];
      const fields=[
        {name:'title',weight:14,text:record.title},
        {name:'original',weight:11,text:record.original_title},
        ...keywords.map(text=>({name:'keyword',weight:12,text})),
        {name:'organization',weight:5,text:record.organization},
        {name:'category',weight:2,text:record.category},
        {name:'year',weight:4,text:record.year}
      ].filter(f=>f.text).map(f=>({...f,norm:norm(f.text),words:tokens(f.text)}));
      for(const text of [...keywords,record.title])for(const raw of String(text).match(/[\p{L}]{6,}/gu)||[]){

        const old=vocabulary.get(key)||{word:raw.toLowerCase(),count:0};old.count++;vocabulary.set(key,old);

    function search(query){

      const looksId=/^(ptg|gip|onk|inn|std|uzu|uro)[\s-]?\d+$/i.test(raw);
      const results=[];
      for(const e of entries){
        if(looksId){if(e.ids.includes(compact))results.push({record:e.record,score:10000,matchedKeywords:[],terms:[]});continue;}
        let score=terms.length?0:(e.record.collection==='Polskie — wykaz główny'?4:e.record.national_origin==='polskie'&&e.record.polish_text_available?2:0),matched=true;
        for(const term of terms){
          let best=0;
          for(const f of e.fields)for(const word of f.words)best=Math.max(best,wordMatch(word,term)*f.weight);
          if(!best){matched=false;break;}score+=best;
        }
        if(!matched)continue;
        const phrase=terms.join(' ');
        if(terms.length>1)for(const f of e.fields)if(f.norm.includes(phrase))score+=f.weight*.65;
        if(terms.length){
          const current=['potwierdzony_obowiazujacy','aktualna_wg_zrodla','najnowsza_znaleziona','w_wykazie_wydawcy','czesciowo_zaktualizowana'].includes(e.record.currency_status);
          score+=current?2:0;
          if(e.record.polish_text_available)score+=.5;
          if(e.record.national_origin==='polskie')score+=.5;
        }
        const matchedKeywords=(e.record.keywords||[]).filter(k=>terms.some(t=>tokens(k).some(w=>wordMatch(w,t))));
        results.push({record:e.record,score,matchedKeywords,terms});

function resetFilters(){for(const id of ['collection','category','availability'])$(id).value='';render();}
function render(){
  const query=$('q').value.trim(),all=engine.search(query),group=$('collection').value,cat=$('category').value,access=$('availability').value;
  let rows=all.filter(({record:r})=>(!group||r.collection===group)&&(!cat||r.category===cat)&&(!access||access==='local'&&r.local_path||access==='missing'&&!r.local_path||access==='pl'&&r.polish_text_available));
  if($('sort').value==='newest')rows.sort((a,b)=>(b.record.year||0)-(a.record.year||0)||b.score-a.score);
  if($('sort').value==='title')rows.sort((a,b)=>a.record.title.localeCompare(b.record.title,'pl'));
  $('count').textContent=`${rows.length} ${noun(rows.length)}`;$('clear').hidden=!query;
  const hidden=all.length-rows.length;$('outside').hidden=!query||!hidden;
  $('outside').innerHTML=hidden?`<button class="text-button" id="show-all">Poza filtrami: ${hidden} · pokaż wszystkie</button>`:'';
  const suggestions=all.length?[]:engine.suggest(query);$('suggestions').hidden=!suggestions.length;
  $('suggestions').innerHTML=suggestions.length?'Szukaj: '+suggestions.map(s=>`<button class="text-button suggestion" data-query="${esc(s.query)}">${esc(s.query)}</button>`).join(''):'';
  $('list').innerHTML=rows.map(({record:r,matchedKeywords,terms})=>{
    const tags=(query?matchedKeywords:r.keywords||[]).slice(0,4);
    return `<article class="entry" data-id="${esc(r.id)}"><div><div class="year">${esc(r.year||'—')}</div><div class="id">${esc(r.id)}</div></div><div><h2>${highlighted(r.title,terms)}</h2><div class="byline">${esc(r.organization)}<br>${esc(r.language.toUpperCase())}${r.pages?` · ${r.pages} s.`:''}<span class="status">${esc(statusNames[r.currency_status]||r.currency_status)}</span></div>${tags.length?`<div class="tags">${tags.map(k=>`<button class="tag ${query?'matched':''}" data-query="${esc(k)}">${esc(k)}</button>`).join('')}</div>`:''}<details><summary>Szczegóły</summary><div class="detail-body"><p>${esc(r.currency_note)}</p><p><strong>Publikacja:</strong> ${esc(r.publication_date||r.year||'—')}${r.year_basis?` · ${esc(r.year_basis)}`:''}</p>${r.original_title?`<p>${esc(r.original_title)}</p>`:''}<p>${esc(r.notes||'')}</p>${r.keywords?.length?`<p><strong>Hasła:</strong> ${r.keywords.map(k=>esc(k)).join(' · ')}</p>`:''}${r.related_ids?.length?`<p><strong>Powiązane:</strong> ${r.related_ids.map(id=>`<button class="text-button" data-related="${esc(id)}">${esc(id)}</button>`).join(' · ')}</p>`:''}${r.evidence_urls?.length?`<p><strong>Źródła:</strong> ${r.evidence_urls.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener">${i+1}</a>`).join(' · ')}</p>`:''}</div></details></div><div class="actions">${r.local_path?`<a class="file" href="${esc(r.local_path)}" target="_blank" rel="noopener">${esc(r.file_type.toUpperCase())} <span aria-hidden="true">↗</span></a>`:'<span class="no-file">Bez pliku</span>'}<a class="source" href="${esc(r.source_url)}" target="_blank" rel="noopener">Źródło ↗</a></div></article>`;
  }).join('')||'<div class="empty">Brak wyników</div>';
  document.querySelectorAll('[data-query]').forEach(b=>b.addEventListener('click',()=>setQuery(b.dataset.query)));
  document.querySelectorAll('[data-related]').forEach(b=>b.addEventListener('click',()=>{for(const id of ['collection','category','availability'])$(id).value='';setQuery(b.dataset.related);$('q').scrollIntoView({block:'center',behavior:'smooth'});}));
  if($('show-all'))$('show-all').addEventListener('click',resetFilters);
}
$('q').addEventListener('input',render);for(const id of ['collection','category','availability','sort'])$(id).addEventListener('change',render);
$('clear').addEventListener('click',()=>setQuery(''));$('reset').addEventListener('click',resetFilters);
$('q').addEventListener('keydown',e=>{if(e.key==='Escape')setQuery('');});
render();
</script></body></html>
